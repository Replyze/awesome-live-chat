name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  awesome-lint:
    name: awesome-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes awesome-lint@2.3.0
        env:
          # awesome-lint reads the repository's description, topics and license from the GitHub API.
          github_token: ${{ github.token }}
