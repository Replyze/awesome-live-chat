# Checks every link in the list: weekly, by hand, and when the Markdown files change.
# A broken link fails the run and is listed in the run's summary. It opens no issues.
name: Links

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['**.md', '.github/workflows/links.yml']
  pull_request:
    paths: ['**.md', '.github/workflows/links.yml']

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: lychee
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --include-fragments --max-retries 3 --retry-wait-time 5 --timeout 30
            'README.md' 'inactive.md' 'CONTRIBUTING.md'
          jobSummary: true
